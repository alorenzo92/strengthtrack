<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StrengthTrack</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0b0d10;--card:#151a20;--line:#252d36;--tx:#eef2f5;--mut:#8a96a3;--ac:#ff4d4d;--bad:#ff6b5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{padding:12px 12px 170px;max-width:760px;margin:auto}
h1,h2,h3{margin:.3em 0;letter-spacing:-.02em}h2{font-size:26px}small,.m{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
button,select,input{font:inherit;color:var(--tx);background:#1d242c;border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px}
button{font-weight:700}.pri{background:var(--ac);color:#fff;border:0}.bad{color:var(--bad)}
input{width:100%;text-align:center;font-size:22px;font-weight:700;padding:0 4px}
.row{display:grid;grid-template-columns:44px 1fr 1fr 58px 48px 52px;gap:6px;align-items:center;margin:8px 0}
.row.ok input{border-color:var(--ac)}.row.ok .ck{background:var(--ac);color:#fff}.lb.wu{color:#ffb84d}
.e{grid-column:2/7;margin-top:-4px}.flex{display:flex;gap:8px;align-items:center}.flex>*{flex:1}
.dots{display:flex;gap:6px;overflow:auto}.dots button{flex:0 0 44px;padding:0}.dots .on{background:var(--ac);color:#fff}.dots .dn{border-color:var(--ac)}
.pb{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0f1317;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;border-radius:0;min-height:56px;font-size:12px;color:var(--mut)}nav .on{color:var(--ac)}
#tb{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));background:#2a1618;border:1px solid var(--ac);border-radius:16px;display:flex;gap:6px;align-items:center;padding:8px;overflow:hidden}
#tb[hidden]{display:none}#tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}#tt{flex:1;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;padding-left:6px}
.wk{display:grid;grid-template-columns:34px repeat(5,1fr);gap:4px;margin:4px 0;align-items:center}.wk button{min-height:44px;padding:0;font-size:11px}
.fin{background:#3a1518;border-color:var(--ac)}.part{background:#3a2d10}.miss{color:#6b7a8c;border-style:dashed}.td{outline:2px solid #fff}
.li{display:block;width:100%;text-align:left;margin:6px 0}.li small{display:block}
#md{position:fixed;inset:0;background:#000d;overflow:auto;padding:16px;z-index:9}#md>div{max-width:560px;margin:auto}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-weight:700}
svg{width:100%;height:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
</style></head><body><main id="m"></main>
<div id="tb" hidden><div id="tbar"></div><span id="tt"></span><button data-a="tp">⏯</button><button data-a="tr">↺</button><button data-a="ts">Skip</button></div>
<nav id="nv"></nav><div id="md" hidden></div><script src="app.js"></script></body></html>
