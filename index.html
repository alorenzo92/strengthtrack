<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StrengthTrack</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#111827;--card:#1e293b;--line:#334155;--tx:#f1f5f9;--mut:#94a3b8;--ac:#ff4b4b;--bad:#fca5a5;--inp:#111827;--btn:#2b3a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{padding:12px 12px 170px;max-width:760px;margin:auto}
h1,h2,h3{margin:.3em 0;letter-spacing:-.02em}h2{font-size:26px}small,.m{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
button,select,input{font:inherit;color:var(--tx);background:var(--btn);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px}
button{font-weight:700}.pri{background:var(--ac);color:#fff;border:0}.bad{color:var(--bad)}
input{width:100%;text-align:center;font-size:22px;font-weight:700;padding:0 4px}
.row{display:grid;grid-template-columns:48px 1fr 1fr 60px;gap:10px;align-items:center;margin:16px 0 8px}.sub{grid-column:2/4;display:flex;gap:10px}.sub input{width:96px;flex:0 0 96px;font-size:17px;min-height:42px}.sub button{flex:1;min-height:42px;font-size:14px}
.row.ok input{border-color:var(--ac)}.row.ok .ck{background:var(--ac);color:#fff}.lb.wu{color:#ffb84d}
.e{grid-column:2/5;margin-top:0;line-height:1.5}.flex{display:flex;gap:10px;align-items:center}.flex>*{flex:1}
.dots{display:flex;gap:6px;overflow:auto}.dots button{flex:0 0 44px;padding:0}.dots .on{background:var(--ac);color:#fff}.dots .dn{border-color:var(--ac)}
.pb{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0f172a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;border-radius:0;min-height:56px;font-size:12px;color:var(--mut)}nav .on{color:var(--ac)}
#tb{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));background:#2a1618;border:1px solid var(--ac);border-radius:16px;display:flex;gap:6px;align-items:center;padding:8px;overflow:hidden}
#tb[hidden]{display:none}#tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}#tt{flex:1;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;padding-left:6px}
.wk{display:grid;grid-template-columns:34px repeat(5,1fr);gap:4px;margin:4px 0;align-items:center}.wk button{min-height:44px;padding:0;font-size:11px}
.fin{background:#3a1518;border-color:var(--ac)}.part{background:#3a2d10}.miss{color:#6b7a8c;border-style:dashed}.td{outline:2px solid #fff}
.li{display:block;width:100%;text-align:left;margin:6px 0}.li small{display:block}
#md{position:fixed;inset:0;background:#000d;overflow:auto;padding:16px;z-index:9}#md>div{max-width:560px;margin:auto}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-weight:700}
svg{width:100%;height:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}

input{background:var(--inp)}
.card h2{font-size:20px;font-weight:700;color:#fff;margin:0 0 4px}
.tag{display:inline-block;background:rgba(255,75,75,.16);color:#ff8f8f;border:1px solid rgba(255,75,75,.55);border-radius:8px;padding:1px 8px;font-weight:700;font-size:13px;margin-left:4px}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow:auto;flex:1}.chip{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:20px;font-size:15px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ib{flex:0 0 40px;width:40px;min-height:40px;padding:0;border-radius:50%;font-size:18px}
.tbl{padding:10px 10px 6px}
.th,.row{display:grid;grid-template-columns:36px 1.2fr 1fr .8fr 46px 46px;gap:6px;align-items:center}.th span{line-height:1.15}.cp{min-height:44px;padding:0;font-size:18px}
.th{font-size:10px;letter-spacing:.08em;color:var(--mut);font-weight:700;text-align:center;background:#111827;border-radius:8px;padding:6px 0;margin-bottom:6px}
.row{margin:6px 0}.row input{min-height:44px;font-size:18px}.lb,.ck{min-height:44px;padding:0}
.e{grid-column:1/-1;font-size:11px;color:var(--mut);line-height:1.4;padding:0 2px;margin:0}.e:empty{display:none}
.lnk{background:none;border:0;color:#ff8f8f;min-height:36px;padding:0 4px;font-size:13px;width:100%;text-align:left}
.tb3{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0}.tb3 button{flex:1;background:transparent;border:0;min-height:44px;border-radius:10px;font-size:14px}.tb3 button+button{border-left:1px solid var(--line);border-radius:0 10px 10px 0}
.cap{font-size:11px;color:#64748b;line-height:1.4;margin:10px 0}
.row.ok input{border-color:#22c55e}.row.ok .ck{background:#22c55e;color:#052e16}.dots .dn{border-color:#22c55e}.fin{background:#0f3a2e;border-color:#22c55e}
.fin-b{display:inline-block;margin-left:6px;vertical-align:middle;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.5);color:#34d399;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.pic{background:#0f172a;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin:0 4px}.pic svg{display:block}
.fa{animation:fa 2.4s infinite}.fb{animation:fb 2.4s infinite}
@keyframes fa{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}@keyframes fb{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.fa,.fb{animation:none}.fb{display:none}}
</style></head><body><main id="m"></main>
<div id="tb" hidden><div id="tbar"></div><span id="tt"></span><button data-a="tp">⏯</button><button data-a="tr">↺</button><button data-a="ts">Skip</button></div>
<nav id="nv"></nav><div id="md" hidden></div><script src="app.js"></script></body></html>
